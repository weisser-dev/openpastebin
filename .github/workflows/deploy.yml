name: Deploy OpenPasteBin

# Self-hosted Runner im docker-host (LXC 110), deployed nach /opt/openpastebin.
# MongoDB = gemeinsames Replica-Set (server-essentials), Backup macht dort mongodb-backup.yml.
# /opt/openpastebin/.env (MONGO_URI, ENCRYPTION_KEY) liegt nur auf dem Server.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: deploy-openpastebin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Guard .env
        run: test -f /opt/openpastebin/.env || { echo "ERROR: /opt/openpastebin/.env fehlt (ENCRYPTION_KEY!)"; exit 1; }

      - name: Ensure shared networks exist
        run: |
          docker network inspect caddy-public >/dev/null 2>&1 || docker network create caddy-public
          docker network inspect db-net >/dev/null 2>&1 || docker network create --internal db-net

      - name: Sync to deploy directory
        run: |
          mkdir -p /opt/openpastebin
          rsync -a --delete --exclude '.git' --exclude '.env' --exclude 'node_modules' "$GITHUB_WORKSPACE/" /opt/openpastebin/

      - name: Build & deploy
        run: |
          cd /opt/openpastebin
          docker compose -p openpastebin up -d --build --remove-orphans --force-recreate

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if docker exec openpastebin-backend wget -qO- http://127.0.0.1:5000/api/health >/dev/null 2>&1; then echo healthy; exit 0; fi
            sleep 2
          done
          docker logs --tail 50 openpastebin-backend; exit 1

      - name: Prune unused images
        run: docker image prune -f

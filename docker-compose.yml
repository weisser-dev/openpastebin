# Deployment auf dem Proxmox-docker-host (LXC 110).
# MongoDB: gemeinsames Replica-Set aus server-essentials (Netz db-net, DB "openpastebin").
# MONGO_URI + ENCRYPTION_KEY stehen nur in /opt/openpastebin/.env auf dem Server.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openpastebin-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - pastebin-network
      - db-net
      - caddy-public
    healthcheck:
      # 127.0.0.1, not localhost: that also resolves to ::1, which wget tries
      # first, while the server binds IPv4 only - the check failed permanently.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "none"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openpastebin-frontend
    restart: unless-stopped
    # Port 80 nur intern - Caddy (caddy-public) liefert aus
    depends_on:
      - backend
    networks:
      - pastebin-network
      - caddy-public
    logging:
      driver: "none"

networks:
  pastebin-network:
    driver: bridge
  caddy-public:
    external: true
  db-net:
    external: true
